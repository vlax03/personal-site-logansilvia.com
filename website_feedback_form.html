                <style>
                    /* Background with Image and Gradient */
                    body {
                        margin: 0;
                        font-family: Arial, sans-serif;

                    main {
                        padding: 20px;
                    }

                    h2 {
                        font-size: 2em;
                        margin-bottom: 20px;
                    }

                    button {
                        background-color: #8b4513; /* Coffee-brown button color */
                        color: white;
                        padding: 10px 15px;
                        border: none;
                        border-radius: 5px;
                        cursor: pointer;
                        transition: background-color 0.3s ease, transform 0.3s ease; /* Transition for hover effect */
                    }
        
                    button:hover {
                        background-color: #5a2f0b; /* Darker brown on hover */
                        transform: translateY(-5px); /* Move up on hover */
                    }
        
                    footer {
                        background-color: rgba(0, 0, 0, 0.6);
                        text-align: center;
                        padding: 10px;
                        position: fixed;
                        width: 100%;
                        bottom: 0;
                    }
        
                    footer p {
                        margin: 5px 0;
                    }
        
                    footer a {
                        color: #ffffff;
                        text-decoration: none;
                    }
        
                    footer a:hover {
                        text-decoration: underline;
                    }
